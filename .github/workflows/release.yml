name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CHANGELOG_VERSION="${VERSION%-test}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "changelog_version=$CHANGELOG_VERSION" >> "$GITHUB_OUTPUT"

          echo "Release version: $VERSION"
          echo "Changelog version: $CHANGELOG_VERSION"

      - name: Build mod
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew build -Pmod_version="${{ steps.version.outputs.version }}"

      - name: Extract release notes
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.changelog_version }}"

          if [ ! -f CHANGELOG.md ]; then
            echo "CHANGELOG.md was not found."
            exit 1
          fi

          awk -v version="$VERSION" '
            $0 == "## " version { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "No changelog entry found for version $VERSION."
            echo "Expected a heading like: ## $VERSION"
            exit 1
          fi

          echo "Release notes:"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "LessLush Grass ${{ steps.version.outputs.version }} for Fabric 26.2"
          body_path: release-notes.md
          draft: ${{ endsWith(github.ref_name, '-test') }}
          prerelease: false
          files: |
            build/libs/less_lush_grass-*.jar
          fail_on_unmatched_files: true